<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXAWEAR | ARCHIVE SYSTEM 2026</title>
    
    <script src="https://js.stripe.com/v3/"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@200;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #ff0000; --bg: #050505; --surface: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1); --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }

        /* Nawigacja */
        nav { position: fixed; width: 100%; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 2000; background: rgba(5, 5, 5, 0.9); border-bottom: 1px solid var(--border); backdrop-filter: blur(15px); }
        .logo { font-family: 'Syncopate', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 4px; text-decoration: none; color: white; }
        .logo span { color: var(--primary); }
        .nav-links a { color: white; text-decoration: none; font-size: 10px; margin-left: 20px; letter-spacing: 1px; }

        /* Sekcje */
        .page-section { display: none; padding-top: 100px; min-height: 100vh; animation: fadeIn 0.4s ease forwards; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Timer Styles */
        .timer-container { display: flex; justify-content: center; gap: 15px; margin: 40px 0; }
        .t-box { background: var(--surface); border: 1px solid var(--border); padding: 20px; min-width: 90px; text-align: center; }
        .t-box span { display: block; font-size: 28px; font-family: 'Syncopate'; color: var(--primary); font-weight: 700; }
        .t-box label { font-size: 9px; opacity: 0.5; letter-spacing: 2px; text-transform: uppercase; }

        /* Produkty */
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 0 5% 50px; }
        .product-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; text-align: center; }
        .product-card img { width: 100%; height: auto; margin-bottom: 15px; border: 1px solid var(--border); }
        .size-btn { border: 1px solid var(--border); padding: 10px 18px; cursor: pointer; font-size: 11px; margin: 5px; transition: 0.3s; display: inline-block; color: #fff; }
        .size-btn.selected { border-color: var(--primary); background: rgba(255,0,0,0.2); }

        /* Koszyk i Formularze */
        .checkout-grid { display: grid; grid-template-columns: 1fr 400px; gap: 30px; max-width: 1250px; margin: 0 auto; padding: 20px; }
        input { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; margin-bottom: 12px; outline: none; }
        .btn-nexa { width: 100%; padding: 20px; background: none; border: 1px solid #fff; color: #fff; font-family: 'Syncopate'; font-size: 10px; cursor: pointer; transition: 0.4s; letter-spacing: 2px; }
        .btn-nexa:hover { background: #fff; color: #000; }

        .cart-summary { background: #fff; color: #000; padding: 30px; border-radius: 2px; }
        .cart-item-row { display: flex; gap: 15px; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .cart-item-row img { width: 60px; height: 80px; object-fit: cover; }

        /* Metody płatności */
        .pay-methods { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 20px 0; }
        .pay-card { border: 1px solid var(--border); padding: 15px; text-align: center; cursor: pointer; font-size: 10px; opacity: 0.6; }
        .pay-card.active { border-color: var(--primary); opacity: 1; background: rgba(255,0,0,0.1); }

        @media (max-width: 900px) { .checkout-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo" onclick="showPage('home')">NEXA<span>WEAR</span></a>
        <div class="nav-links">
            <a href="#" onclick="showPage('shop')">SHOP</a>
            <a href="#" onclick="showPage('checkout')">BAG (<span id="cart-count">0</span>)</a>
            <a href="#" onclick="showPage('auth')" id="nav-user-icon"><i class="fas fa-user"></i></a>
        </div>
    </nav>

    <section id="home" class="page-section active">
        <div style="text-align:center; padding:80px 20px;">
            <p style="letter-spacing:10px; font-size:10px; margin-bottom:20px; color:var(--primary);">COUNTDOWN TO DROP</p>
            <h1 style="font-family:'Syncopate'; font-size: 8vw;">NEXAWEAR_2026</h1>
            
            <div class="timer-container">
                <div class="t-box"><span id="days">00</span><label>Dni</label></div>
                <div class="t-box"><span id="hours">00</span><label>Godz</label></div>
                <div class="t-box"><span id="mins">00</span><label>Min</label></div>
                <div class="t-box"><span id="secs">00</span><label>Sek</label></div>
            </div>

            <button class="btn-nexa" style="max-width:320px;" onclick="showPage('shop')">SKLEP</button>
        </div>
    </section>

    <section id="shop" class="page-section">
        <div class="shop-grid">
            <div class="product-card" id="prod_red">
                <img src="szerokie czerwone.jpg">
                <h2 style="font-family:'Syncopate'; font-size:11px; margin:15px 0;">NEXAWEAR FLARE / RED-BLACK</h2>
                <p style="font-weight:900; margin-bottom:15px;">179.99 PLN</p>
                <div style="margin-bottom:15px;">
                    <span class="size-btn" onclick="selectSize('prod_red', 'M')">M</span>
                    <span class="size-btn" onclick="selectSize('prod_red', 'L')">L</span>
                </div>
                <button class="btn-nexa" onclick="addToCart('prod_red', 'NEXAWEAR Red', 179.99, 'szerokie czerwone.jpg')">DODAJ DO ZAMÓWIENIE</button>
            </div>

            <div class="product-card" id="prod_white">
                <img src="szerokie białe.jpg">
                <h2 style="font-family:'Syncopate'; font-size:11px; margin:15px 0;">NEXAWEAR FLARE / ACID WHITE</h2>
                <p style="font-weight:900; margin-bottom:15px;">179.99 PLN</p>
                <div style="margin-bottom:15px;">
                    <span class="size-btn" onclick="selectSize('prod_white', 'M')">M</span>
                    <span class="size-btn" onclick="selectSize('prod_white', 'L')">L</span>
                </div>
                <button class="btn-nexa" onclick="addToCart('prod_white', 'NEXAWEAR White', 179.99, 'szerokie białe.jpg')">DODAJ DO ZAMÓWIENIE</button>
            </div>
        </div>
    </section>

    <section id="auth" class="page-section">
        <div style="max-width:400px; margin:0 auto; background:var(--surface); padding:35px; border:1px solid var(--border);">
            <div style="display:flex; border-bottom:1px solid var(--border); margin-bottom:25px;">
                <div id="tab-login" class="btn-nexa" style="border:none; flex:1;" onclick="setAuthMode('login')">LOGIN</div>
                <div id="tab-reg" class="btn-nexa" style="border:none; flex:1; opacity:0.5;" onclick="setAuthMode('reg')">SIGN UP</div>
            </div>

            <div id="auth-forms">
                <div id="login-fields">
                    <input type="email" id="l-email" placeholder="EMAIL">
                    <input type="password" id="l-pass" placeholder="HASŁO">
                    <button class="btn-nexa" onclick="login()">ZALOGUJ</button>
                </div>
                <div id="reg-fields" style="display:none;">
                    <input type="text" id="r-name" placeholder="IMIĘ I NAZWISKO">
                    <input type="email" id="r-email" placeholder="EMAIL">
                    <input type="password" id="r-pass" placeholder="HASŁO">
                    <button class="btn-nexa" onclick="register()">STWÓRZ KONTO</button>
                </div>
            </div>
            
            <div id="auth-user" style="display:none; text-align:center;">
                <p id="user-display" style="font-family:'Syncopate'; font-size:10px; margin-bottom:20px;"></p>
                <button class="btn-nexa" onclick="logout()">WYLOGUJ</button>
            </div>
        </div>
    </section>

    <section id="checkout" class="page-section">
        <div class="checkout-grid">
            <div>
                <div style="background:var(--surface); padding:25px; border:1px solid var(--border); margin-bottom:20px;">
                    <h3 style="font-family:'Syncopate'; font-size:10px; margin-bottom:20px;">DANE DOSTAWY</h3>
                    <input type="text" id="ship-name" placeholder="IMIĘ I NAZWISKO">
                    <input type="text" id="ship-street" placeholder="ULICA I NUMER">
                    <input type="text" id="ship-city" placeholder="MIASTO I KOD POCZTOWY">
                    <input type="text" id="ship-inpost" placeholder="PACZKOMAT (NP. WAW01M)">
                </div>
                <div style="background:var(--surface); padding:25px; border:1px solid var(--border);">
                    <h3 style="font-family:'Syncopate'; font-size:10px; margin-bottom:15px;">METODA PŁATNOŚCI</h3>
                    <div class="pay-methods">
                        <div class="pay-card active" onclick="setPayMethod(this, 'blik')">BLIK</div>
                        <div class="pay-card" onclick="setPayMethod(this, 'card')">KARTA</div>
                        <div class="pay-card" onclick="setPayMethod(this, 'p24')">PRZELEW</div>
                    </div>
                </div>
            </div>

            <div class="cart-summary">
                <h2 style="font-family:'Syncopate'; font-size:12px; margin-bottom:20px; border-bottom:2px solid #000; padding-bottom:10px;">TWOJE ZAMÓWIENIE</h2>
                <div id="cart-items-list"></div>
                <div style="margin-top:20px; border-top:1px solid #000; padding-top:15px;">
                    <div style="display:flex; justify-content:space-between; font-weight:900; font-size:16px;">
                        <span>TOTAL:</span><span id="final-price">0.00 PLN</span>
                    </div>
                </div>
                <button class="btn-nexa" style="background:#000; color:#fff; border:none; margin-top:20px;" onclick="processPayment()">SFINALIZUJ ZAMÓWIENIE</button>
            </div>
        </div>
    </section>

    <script>
        let cart = [];
        let selectedSizes = {};
        let currentPayMethod = 'blik';

        // 1. TIMER LOGIC
        function updateTimer() {
            const target = new Date("April 22, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = target - now;

            if (diff > 0) {
                document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                document.getElementById('secs').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
            }
        }
        setInterval(updateTimer, 1000);

        // 2. SHOP LOGIC
        function selectSize(pId, size) {
            selectedSizes[pId] = size;
            document.querySelectorAll(`#${pId} .size-btn`).forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function addToCart(pId, name, price, img) {
            if(!selectedSizes[pId]) return alert("PROSZĘ WYBRAĆ ROZMIAR!");
            cart.push({ id: Date.now(), name: `${name} (${selectedSizes[pId]})`, price, img });
            updateUI();
        }

        function updateUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            list.innerHTML = cart.map(item => `
                <div class="cart-item-row">
                    <img src="${item.img}">
                    <div style="flex:1">
                        <p style="font-size:10px; font-weight:700;">${item.name}</p>
                        <p style="font-size:12px;">${item.price} PLN</p>
                    </div>
                    <i class="fas fa-trash" style="cursor:pointer; font-size:12px;" onclick="removeItem(${item.id})"></i>
                </div>
            `).join('');
            const total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('final-price').innerText = total.toFixed(2) + " PLN";
        }

        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            updateUI();
        }

        // 3. AUTH LOGIC (LocalStorage)
        function setAuthMode(mode) {
            document.getElementById('login-fields').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('reg-fields').style.display = mode === 'reg' ? 'block' : 'none';
            document.getElementById('tab-login').style.opacity = mode === 'login' ? '1' : '0.5';
            document.getElementById('tab-reg').style.opacity = mode === 'reg' ? '1' : '0.5';
        }

        function register() {
            const email = document.getElementById('r-email').value;
            const name = document.getElementById('r-name').value;
            const pass = document.getElementById('r-pass').value;
            if(!email || !pass) return alert("Uzupełnij dane!");
            localStorage.setItem(`u_${email}`, JSON.stringify({ name, email, pass }));
            alert("Konto założone! Zaloguj się.");
            setAuthMode('login');
        }

        function login() {
            const email = document.getElementById('l-email').value;
            const pass = document.getElementById('l-pass').value;
            const user = JSON.parse(localStorage.getItem(`u_${email}`));
            if(user && user.pass === pass) {
                localStorage.setItem('session', JSON.stringify(user));
                checkSession();
                showPage('shop');
            } else { alert("Błędne dane logowania!"); }
        }

        function checkSession() {
            const user = JSON.parse(localStorage.getItem('session'));
            if(user) {
                document.getElementById('auth-forms').style.display = 'none';
                document.getElementById('auth-user').style.display = 'block';
                document.getElementById('user-display').innerText = `ZALOGOWANY: ${user.name}`;
                document.getElementById('nav-user-icon').style.color = 'var(--primary)';
                document.getElementById('ship-name').value = user.name;
            }
        }

        function logout() { localStorage.removeItem('session'); location.reload(); }

        // 4. CHECKOUT LOGIC
        function setPayMethod(el, method) {
            currentPayMethod = method;
            document.querySelectorAll('.pay-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

      async function processPayment() {
    if(!localStorage.getItem('session')) return showPage('auth');
    if(cart.length === 0) return alert("Koszyk pusty!");

    const shippingData = {
        name: document.getElementById('ship-name').value,
        inpost: document.getElementById('ship-inpost').value
    };

    try {
        const response = await fetch('/create-checkout-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                items: cart, 
                shipping: shippingData, // Przesyłamy dane do serwera
                discountActive: false 
            })
        });

        const session = await response.json();
        const result = await stripe.redirectToCheckout({ sessionId: session.id });
    } catch (error) {
        console.error("Błąd:", error);
    }
}

        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        window.onload = () => { checkSession(); updateTimer(); };
    </script>
</body>
</html>
